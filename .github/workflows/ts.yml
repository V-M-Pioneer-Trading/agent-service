name: ts

# The TypeScript port in ts/ (meta#103, decision 23). Nothing here deploys: the
# `container` workflow keeps building and deploying the Go image until the
# cutover. These jobs are deliberately not named like the required checks
# (`test`, `image`, `contract`) and do not touch them.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded pull request runs are cancelled; a run on main never is.
concurrency:
  group: ts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ts-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json

      # --ignore-scripts: no dependency's install script runs, here or in the image.
      - run: npm ci --ignore-scripts

      - name: Direct dependencies are exactly the allowlist
        run: npm run check:deps

      - name: Audit
        run: npm audit --audit-level=high

      # tsoa codegen, then tsc over sources and tests with the strict flag set.
      - run: npm run typecheck

      - run: npm run build

      # The committed openapi.json must match the controllers. Regenerates it (no
      # server, DB or network) and fails on any difference.
      - name: Check openapi.json is up to date
        run: |
          npm run openapi
          # git status, not git diff: a deleted or never-committed file shows as
          # untracked, which git diff would let through.
          test -z "$(git status --porcelain -- openapi.json)" || { git diff -- openapi.json; echo "::error file=ts/openapi.json::ts/openapi.json is out of date. Run 'npm run openapi' in ts/ and commit the result."; exit 1; }

      - run: npm test

  # The contract suite (contract/, unchanged) against the TypeScript image,
  # minus the cases in ts/contract-skip.txt: routes not ported yet. The list only
  # shrinks and is empty after agent-service#37. The required `contract` check
  # (contract.yml) still runs the suite against the Go image.
  contract-ts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contract/package-lock.json

      - name: Build the TypeScript image
        run: docker build -t agent-service-ts:contract ts

      - name: Install the suite's dev dependencies
        working-directory: contract
        run: npm ci --ignore-scripts

      - name: Run the contract suite against the TypeScript image
        env:
          CONTRACT_IMAGE: agent-service-ts:contract
        run: node ts/scripts/run-contract.js

      - name: Show the service log
        if: failure()
        working-directory: contract
        run: cat .out/service.log || true
