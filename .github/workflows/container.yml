name: container

on:
  # No branch filter: a pull request stacked on another branch needs the same
  # checks as one targeting main. Filtering to main meant a stacked PR ran
  # nothing at all and looked green by default.
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  # Manual redeploy of main, for when the tip's own run was displaced or never
  # started (see the concurrency comment below).
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. On 2026-09-25 auth-service #5 and #6 merged seconds
# apart; their runs overlapped, #5's older commit pushed :latest last and its
# redeploy ran last, so production ran without #6's fix until #6's run was
# re-run by hand.
#
# Only runs on main can deploy (the deploy role trusts refs/heads/main alone),
# so only they share the group. Everything else, pull requests and v* tags
# included, gets a group of its own and never queues or displaces a main run.
# cancel-in-progress stays false so a run is never killed halfway through a
# push or a host restart. GitHub keeps one run pending per group and a newer
# one replaces it, so a burst of merges skips straight to the newest.
#
# GitHub does not promise the queue runs in push order, and a re-run of an old
# run joins it too. The tip-of-main check in the docker job stops both from
# putting an older commit on :latest. It cannot bring back a tip whose own run
# was displaced from the pending slot (say by a re-run of an old one) or never
# started: the runs that remain are not the tip and skip, with a warning.
# Recover by dispatching this workflow on main.
concurrency:
  group: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && format('deploy-{0}', github.repository) || format('run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # Runs on pull requests *and* on push: previously a direct push to main
  # skipped the tests entirely and went straight to build-and-deploy.
  test:
    runs-on: ubuntu-latest
    # The concurrency group spans the whole workflow, so a hung test job holds
    # the deploy slot too. The suite takes a minute or two.
    timeout-minutes: 15
    services:
      # For mysql.integration.test.ts: a real MySQL whose global time zone the test moves off UTC.
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: example
          MYSQL_DATABASE: vnm-agent-db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pexample"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # --ignore-scripts: no dependency's install script runs, here or in the image.
      - run: npm ci --ignore-scripts

      - name: Direct dependencies are exactly the allowlist
        run: npm run check:deps

      - name: Audit
        run: npm audit --audit-level=high

      # tsoa codegen, then tsc over sources and tests with the strict flag set.
      - run: npm run typecheck

      # The shared ESLint config (@v-m-pioneer-trading/eslint-config, meta#105), after the typecheck: tsoa's output in
      # src/generated/ has to exist for the type-aware rules, and is itself ignored. Warnings fail like errors.
      - name: Lint
        run: npm run lint

      - run: npm run build

      # The committed openapi.json must match the controllers. Regenerates it (no
      # server, DB or network) and fails on any difference.
      - name: Check openapi.json is up to date
        run: |
          npm run openapi
          # git status, not git diff: a deleted or never-committed file shows as
          # untracked, which git diff would let through.
          test -z "$(git status --porcelain -- openapi.json)" || { git diff -- openapi.json; echo "::error file=openapi.json::openapi.json is out of date. Run 'npm run openapi' and commit the result."; exit 1; }

      - run: npm test
        env:
          TEST_MYSQL_HOST: 127.0.0.1
          TEST_MYSQL_PORT: "3306"

  # The black-box HTTP contract suite (contract/) against the image this
  # repository builds: the whole of it, nothing skipped (contract-skip.txt is
  # empty), judged by scripts/run-contract.cjs. It is the parity record of the
  # Go to TypeScript port and stays a gate. It never holds up the deploy job.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Same major as compose and production (see CLAUDE.md). The image under
      # test reaches it through host.docker.internal on the published port.
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: example
          MYSQL_DATABASE: vnm-agent-db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pexample"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contract/package-lock.json

      - name: Build the image
        run: docker build -t agent-service:contract .

      - name: Install the suite's dev dependencies
        working-directory: contract
        run: npm ci --ignore-scripts

      - name: Typecheck the suite
        working-directory: contract
        run: npm run typecheck

      - name: Run the contract suite against the image
        env:
          CONTRACT_IMAGE: agent-service:contract
          CONTRACT_MYSQL_HOST: host.docker.internal
          CONTRACT_MYSQL_PORT: "3306"
          CONTRACT_MYSQL_USER: root
          CONTRACT_MYSQL_PASSWORD: example
          CONTRACT_MYSQL_DATABASE: vnm-agent-db
        run: node scripts/run-contract.cjs

      # The service's own log, for a run that failed. The suite writes it on the
      # way out, before it removes the container.
      - name: Show the service log
        if: failure()
        working-directory: contract
        run: cat .out/service.log || true

  # The deploy job below builds the image and ships it to production in one
  # step, so without this a broken Dockerfile is first discovered mid-deploy.
  # Single-platform and push-less keeps it to well under a minute — the reason
  # the full multi-platform build was taken off pull requests in the first
  # place (#13) was its cost, not its value.
  image:
    if: github.event_name == 'pull_request'
    # Same runner and platform as the deploy job, so this checks the image
    # production runs and shares its layer cache.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker:
    # A push to main or a tag, or a manual dispatch on main; never a pull
    # request, and no image built from a dispatch on another branch.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: test
    # Deploy credentials live on this job alone. Declared at workflow level they
    # reached the test job too, and since that job runs on pushes to main its
    # OIDC token satisfies the deploy role's trust policy: dependency code and test
    # code run by `npm test` could have assumed the role that redeploys production.
    permissions:
      contents: read
      packages: write
      id-token: write
    # Native arm64: the shared host is a t4g (Graviton), so arm64 is the only
    # image production runs. It used to be built next to amd64 on an x86 runner,
    # the arm64 half under QEMU: 7-10x slower than native (navigation-service's
    # Gradle build took 8 minutes of a 9-minute job), and on 2026-09-25 an
    # emulated `npm ci` in fleet-service died with "Illegal instruction" and hung
    # the job for six hours.
    runs-on: ubuntu-24.04-arm
    # A hung build now holds the deploy concurrency slot and blocks every later
    # deploy in this repo, so it must not get GitHub's six-hour default. A
    # native build takes a few minutes and the redeploy waits up to ~15.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Deploys only if this commit is still the tip of main. The group above
      # serializes runs but does not order them, so without this an older run
      # that got the slot second, or a re-run of an old run, would push :latest
      # and redeploy over a newer commit. The sha tag is still built either way.
      # Tag runs and dispatches from other branches stop here too: the deploy
      # role would refuse them anyway.
      - name: Check this commit is still the tip of main
        id: tip
        run: |
          # --exit-code and no pipe on ls-remote: a failed lookup must fail the
          # run, not read as "not the tip" and skip with a green check. The
          # pattern matches ref-name suffixes (a branch x/refs/heads/main
          # matches too), so keep the exact ref only.
          refs=$(git ls-remote --exit-code origin refs/heads/main)
          tip=$(printf '%s\n' "$refs" | awk '$2 == "refs/heads/main" { print $1 }')
          [ -n "$tip" ] || { echo "::error::refs/heads/main not found on origin"; exit 1; }
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$tip" = "$GITHUB_SHA" ]; then
            echo "Deploying $GITHUB_SHA, the tip of main."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            # Normally the run for $tip is queued behind this one and deploys
            # it. If that run was displaced or never started, nothing does:
            # dispatch this workflow on main.
            echo "::warning::Not deploying $GITHUB_SHA: main is at $tip, whose own run should deploy it. If it has none, run this workflow on main by hand."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deploying: $GITHUB_REF is not main."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/v-m-pioneer-trading/agent-service
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ steps.tip.outputs.deploy == 'true' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # Layer cache in the Actions cache: layers whose inputs did not change
          # are reused. ignore-error: a cache export hiccup must not fail the
          # build after the image and :latest are already pushed, which would
          # skip the redeploy and leave :latest ahead of prod.
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Configure AWS credentials
        if: steps.tip.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::543292785457:role/github-actions-ssm-deploy
          aws-region: eu-central-1

      # Waits for the host to finish, not only for SSM to accept the command.
      # send-command returns as soon as the command is queued, so without the
      # wait this job, and the concurrency slot above, were released while the
      # host was still pulling and restarting, and a bootstrap that failed, its
      # /health check included, left the run green.
      # The SSM output is not printed: these logs are public and the
      # bootstrap's failure path dumps container logs. Read it in the SSM
      # console under the command ID echoed below.
      - name: Redeploy on shared host
        if: steps.tip.outputs.deploy == 'true'
        env:
          INSTANCE_ID: i-011b6b82a9072a385
          DOCUMENT: agent-service-bootstrap-i-011b6b82a9072a385
        run: |
          # --timeout-seconds: a command the host has not picked up within 10
          # minutes is dropped instead of running later, outside the queue.
          command_id=$(aws ssm send-command \
            --document-name "$DOCUMENT" \
            --targets "Key=InstanceIds,Values=$INSTANCE_ID" \
            --timeout-seconds 600 \
            --region eu-central-1 \
            --query Command.CommandId --output text)
          echo "SSM command $command_id"
          # 90 polls, a little over 15 minutes. The slowest bootstrap
          # (agent-service: MySQL, two pulls, /health) takes about 7.
          for _ in $(seq 90); do
            sleep 10
            # InvocationDoesNotExist for a moment right after send-command,
            # until the invocation is registered. Any other error is real.
            if ! status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --region eu-central-1 --query Status --output text 2>"$RUNNER_TEMP/ssm-err"); then
              grep -q InvocationDoesNotExist "$RUNNER_TEMP/ssm-err" || { cat "$RUNNER_TEMP/ssm-err" >&2; exit 1; }
              status=Pending
            fi
            case "$status" in
              Pending|InProgress|Delayed) continue ;;
              Success) exit 0 ;;
            esac
            echo "::error::Redeploy $command_id ended with status $status"
            exit 1
          done
          echo "::error::Redeploy $command_id still running after 15 minutes"
          exit 1

  # Sync the committed spec to meta's openapi/ (meta#26) on a push or a manual
  # dispatch on main; meta's workflow skips a commit that is no longer the tip.
  # Only after the tests, which include the check that openapi.json is current.
  sync-openapi:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: V-M-Pioneer-Trading/meta/.github/workflows/openapi-sync.yml@main
    with:
      spec-path: openapi.json
    secrets:
      OPENAPI_SYNC_CLIENT_ID: ${{ secrets.OPENAPI_SYNC_CLIENT_ID }}
      OPENAPI_SYNC_PRIVATE_KEY: ${{ secrets.OPENAPI_SYNC_PRIVATE_KEY }}
