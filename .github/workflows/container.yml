name: container

on:
  # No branch filter: a pull request stacked on another branch needs the same
  # checks as one targeting main. Filtering to main meant a stacked PR ran
  # nothing at all and looked green by default.
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Runs on pull requests *and* on push: previously a direct push to main
  # skipped the tests entirely and went straight to build-and-deploy.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go vet ./...

      - run: go test ./... -race -shuffle=on

  # The deploy job below builds the image and ships it to production in one
  # step, so without this a broken Dockerfile is first discovered mid-deploy.
  # Single-platform and push-less keeps it to well under a minute — the reason
  # the full multi-platform build was taken off pull requests in the first
  # place (#13) was its cost, not its value.
  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker:
    if: github.event_name == 'push'
    needs: test
    # Deploy credentials live on this job alone. Declared at workflow level they
    # reached the test job too, and since that job runs on pushes to main its
    # OIDC token satisfies the deploy role's trust policy: dependency code and test
    # code run by `go test` could have assumed the role that redeploys production.
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/v-m-pioneer-trading/agent-service
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::543292785457:role/github-actions-ssm-deploy
          aws-region: eu-central-1

      - name: Trigger redeploy on shared host
        run: |
          aws ssm send-command \
            --document-name "agent-service-bootstrap-i-011b6b82a9072a385" \
            --targets "Key=InstanceIds,Values=i-011b6b82a9072a385" \
            --region eu-central-1
