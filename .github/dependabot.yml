version: 2
updates:
  # Express stays on 4 (clerk-client's adapter targets it); @types follow the
  # runtime they describe (Express 4, Node 24), so their majors are not taken
  # on their own. Any other major is a reviewed decision in a PR like the rest.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: express
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  # The Dockerfile: node:24-slim build stages and the distroless runtime.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # The workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
