version: 2
updates:
  # Express stays on 4 (clerk-client's adapter targets it); @types follow the
  # runtime they describe (Express 4, Node 24), so their majors are not taken
  # on their own; typescript stays inside what the shared eslint-config accepts
  # (>=5.7 <6.1). Any other major is a reviewed decision in a PR like the rest.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: express
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    open-pull-requests-limit: 5

  # The Dockerfile: node:24-slim build stages and the nodejs24-debian13
  # distroless runtime, all three pinned by digest, so an update is a digest
  # bump. Majors are ignored for both so the build stages cannot diverge from
  # the runtime (node 24 stages, nodejs24 distroless): moving Node is one
  # reviewed PR that changes all three FROM lines and the engines field together.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: "gcr.io/distroless/nodejs*"
        update-types: ["version-update:semver-major"]

  # The workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
