services:
  mysql:
    container_name: vnm-agent-service-db
    restart: always
    # Same tag production runs (infrastructure/agent-service/main.tf). Both
    # track the latest 9.x deliberately: minor upgrades within 9 are safe in
    # place, and the tag still blocks a silent jump to a future major. Keep
    # the two in step — a local MySQL on a different major is a class of bug
    # that only ever shows up in production.
    image: mysql:9
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: example # TODO: Change this
      MYSQL_DATABASE: vnm-agent-db
      MYSQL_USER: 'user'
      MYSQL_PASSWORD: 'pass' # was MYSQL_PASS, which the mysql image doesn't recognize
    volumes:
      - mysql_datavolume:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pexample"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    container_name: vnm-agent-service-app
    build: .
    ports:
      - "8080:80"
    environment:
      MYSQL_HOST: mysql  # Using the service name of MySQL container
      MYSQL_PORT: 3306
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
      MYSQL_DATABASE: vnm-agent-db
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      ST_GATEWAY_URL: ${ST_GATEWAY_URL:-http://host.docker.internal:3002}
      # The service refuses to start without a Clerk trust anchor — a service
      # that boots with authentication silently off is worse than one that
      # doesn't boot. Export CLERK_JWT_KEY (or point CLERK_JWT_KEY_FILE at a
      # mounted PEM) before `docker compose up`; see the README.
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      CLERK_JWT_KEY_FILE: ${CLERK_JWT_KEY_FILE:-}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_datavolume:
